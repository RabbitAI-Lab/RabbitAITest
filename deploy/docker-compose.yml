name: rabbitaitest

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rabbit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rabbit"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # 勘误 1（INFRA-002）：MinIO 官方镜像自 Docker Hub 撤架、quay 源本环境 401；
    # P0 代码未使用 MinIO，默认不启动（profiles 隔离），Sprint 2 文件管理接入时解决镜像源。
    profiles: ["full"]
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrator:
    build:
      context: ..
      dockerfile: Dockerfile
      target: toolbox
    environment: &appenv
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rabbit
      REDIS_URL: redis://redis:6379
      WEB_URL: http://web:3000
      SESSION_SECRET: change-me-in-prod-32chars-secret!
      INTERNAL_TOKEN: change-me-internal-token
      SESSION_COOKIE_SECURE: "false"
    command: ["sh", "-c", "pnpm --filter @rabbit/db migrate-deploy && pnpm --filter @rabbit/db seed"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    environment:
      <<: *appenv
      # Next standalone 监听地址：容器默认 HOSTNAME=容器 ID 会导致 healthcheck 拒连
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://127.0.0.1:3000/api/v1/system/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 30

  engine:
    build:
      context: ..
      dockerfile: Dockerfile
      target: toolbox
    environment: *appenv
    command: pnpm --filter engine start
    depends_on:
      web:
        condition: service_healthy

  mock:
    build:
      context: ..
      dockerfile: Dockerfile
      target: toolbox
    environment: *appenv
    command: pnpm --filter mock start
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
