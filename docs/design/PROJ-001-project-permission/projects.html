<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>PROJ-001 项目管理</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50 text-slate-800">
<header class="h-12 bg-white border-b flex items-center px-4 gap-3 text-sm shrink-0"><span class="font-semibold">RabbitAITest</span><span class="border rounded px-2 py-0.5 text-slate-600">默认组织</span><div class="ml-auto flex items-center gap-3 text-slate-500"><span class="w-6 h-6 rounded-full border grid place-items-center text-xs">?</span><span class="relative">消息<span class="absolute -top-1.5 -right-2.5 bg-[#FF4D4F] text-white text-[10px] rounded-full px-1">3</span></span><span class="w-6 h-6 rounded-full bg-[#574BFF] text-white grid place-items-center text-xs">许</span></div></header>
<div class="flex"><aside class="w-[208px] bg-white border-r p-2 text-sm shrink-0">
  <p class="px-3 pt-2 pb-1 text-xs text-slate-400">组织</p><p class="px-3 py-2 rounded bg-[#574BFF]/10 text-[#574BFF] font-medium">项目管理</p><p class="px-3 py-2 rounded">模板管理</p><p class="px-3 py-2 rounded">用户组管理</p>
  <p class="px-3 pt-3 pb-1 text-xs text-slate-400">系统设置</p><p class="px-3 py-2 rounded">用户管理</p><p class="px-3 py-2 rounded">用户组管理</p><p class="px-3 py-2 rounded">系统参数</p>
</aside>
<main class="flex-1 p-6">
  <div class="flex items-center gap-3 mb-4"><h1 class="text-lg font-medium">项目管理</h1><span class="text-xs border-b-2 border-[#574BFF] text-[#574BFF] pb-0.5 font-medium">项目列表（3）</span><span class="text-xs text-slate-400 pb-0.5 border-b-2 border-transparent">已删除（2）</span><button class="ml-auto bg-[#574BFF] text-white rounded px-3 py-1.5 text-sm">＋ 新建项目</button></div>
  <div class="bg-white border rounded">
    <table class="w-full text-sm">
      <thead class="text-slate-400 text-xs"><tr class="border-b"><th class="text-left p-3">名称</th><th class="text-left p-3">成员数</th><th class="text-left p-3">状态</th><th class="text-left p-3">创建时间</th><th class="text-left p-3">操作</th></tr></thead>
      <tbody>
        <tr class="border-b hover:bg-slate-50"><td class="p-3"><a class="text-[#574BFF]" href="#">演示项目 #1</a><p class="text-xs text-slate-400">冒烟与回归主库</p></td><td class="p-3">12</td><td class="p-3"><span class="inline-flex items-center gap-1.5 text-xs text-[#52C41A]"><span class="w-1.5 h-1.5 rounded-full bg-[#52C41A]"></span>启用</span></td><td class="p-3 text-slate-500">2026-09-01</td><td class="p-3 text-slate-500">进入 · 编辑 · 成员 · 结束 · 删除</td></tr>
        <tr class="border-b hover:bg-slate-50"><td class="p-3"><a class="text-[#574BFF]" href="#">电商平台 V2</a><p class="text-xs text-slate-400">接口与用例并行维护</p></td><td class="p-3">8</td><td class="p-3"><span class="inline-flex items-center gap-1.5 text-xs text-[#52C41A]"><span class="w-1.5 h-1.5 rounded-full bg-[#52C41A]"></span>启用</span></td><td class="p-3 text-slate-500">2026-09-12</td><td class="p-3 text-slate-500">进入 · 编辑 · 成员 · 结束 · 删除</td></tr>
        <tr class="hover:bg-slate-50"><td class="p-3 text-slate-600">历史回归集</td><td class="p-3">5</td><td class="p-3"><span class="inline-flex items-center gap-1.5 text-xs text-slate-400"><span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>已结束（只读）</span></td><td class="p-3 text-slate-500">2026-08-20</td><td class="p-3 text-slate-500">进入 · 编辑 · 成员 · 开启 · 删除</td></tr>
      </tbody>
    </table>
    <div class="flex justify-end items-center gap-2 p-3 text-sm"><span class="text-slate-400 text-xs">共 3 条</span></div>
  </div>
  <!-- 删除 Modal（行内「删除」触发，红色二次确认）：
       标题「删除项目」正文「删除后『演示项目 #1』进入回收站，30 天内可在『已删除』页签撤销恢复；逾期将由系统永久删除并级联清除项目全部数据，该操作不可恢复。」
       [取消][确认删除(红)]；删除与撤销均写操作日志 -->
  <!-- 已删除 Tab（页签「已删除（2）」）：
       行示例：旧后台回归测试（删除于 2026-09-14 · 剩余 12 天自动清除）[撤销]　小程序体验版（删除于 2026-09-24 · 剩余 28 天）[撤销]
       [撤销] → 项目回到列表 + Toast「项目已恢复」；恢复接口 POST /projects/{pid}/restore -->
  <!-- 新建/编辑 Modal：名称*、描述、模块开关（测试用例/测试计划/缺陷管理/接口测试，默认全开；关闭=左导航菜单隐藏+直访重定向工作台，数据保留）[取消][保存] -->
  <!-- 结束确认 Popconfirm：「结束后项目转为只读，全部写操作将被拒绝（422 code 10005 PROJECT_ENDED）」；已结束项目行内按钮为「开启」可恢复 -->
  <!-- 「成员」→ 进入该项目 设置 › 成员管理（见 members.html）；「进入」→ 切换到该项目工作台（顶栏 chip 随之切换） -->
  <!-- 权限态：无 ORG_PROJECT:CREATE → 「＋ 新建项目」隐藏；无 ORG_PROJECT:DELETE → 行内「删除」不渲染；本页仅组织管理员可见 -->
  <!-- 空态：暂无项目 → 居中引导「创建第一个项目」；项目切换器仅显示当前用户所属项目，非成员直访项目 URL 返回 404 -->
</main></div></body></html>
