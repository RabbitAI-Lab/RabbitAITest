name: ci

on:
  # 文档-only 变更（docs/规则/CHANGELOG/原型）不触发全量 CI——纯文档不可能破坏代码，
  # 避免收尾补记证据这类提交浪费 ~7 分钟（2026-09-26 S1 收尾教训）。
  # 代码/配置任何变更仍全量执行；main 保护语义不变。
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "CHANGELOG.md"
      - ".oxfmtignore"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "CHANGELOG.md"
      - ".oxfmtignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @rabbit/db generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: OpenAPI 快照校验（INFRA-001 勘误1：路由↔openapi.json 一致 + api-client 手写路径审计）
        run: node scripts/gen-openapi.mjs --check

  build:
    name: next build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @rabbit/db generate
      - run: pnpm --filter web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 3

  migrate-replay:
    name: 空库全量迁移重放
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rabbit_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @rabbit/db generate
      - name: migrate deploy + diff + seed 幂等
        run: |
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rabbit_ci
          pnpm --filter @rabbit/db migrate-deploy
          pnpm --filter @rabbit/db exec prisma migrate diff --from-schema-datamodel prisma/schema.prisma --to-url $DATABASE_URL --exit-code && echo "schema in sync"
          pnpm --filter @rabbit/db seed
          pnpm --filter @rabbit/db seed  # 幂等重跑（rules/database §6.5）

  e2e:
    name: Playwright E2E（三类断言）
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rabbit_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rabbit_e2e
      E2E_REDIS_URL: redis://127.0.0.1:6379
      E2E_MOCK_URL: http://127.0.0.1:4000/hello
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @rabbit/db generate
      - run: pnpm --filter web build
      - run: pnpm exec playwright install --with-deps chromium
      - name: run e2e（含每用例截屏）
        run: pnpm test:e2e
      - name: 视觉快照 + GLM-5.3-Flash 还原度比对（配置 GLM_API_KEY 时启用并强制阈值）
        if: env.GLM_API_KEY != ''
        run: |
          pnpm test:visual
          pnpm visual:diff
      - name: 还原度比对跳过提示（未配置 GLM_API_KEY）
        if: env.GLM_API_KEY == ''
        run: echo 'GLM_API_KEY 未配置，跳过视觉还原度比对（rules/testing §3.7.2）'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            tests/visual/
          retention-days: 30
          if-no-files-found: ignore

  api-test:
    name: JMeter 接口自动化
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rabbit_jm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @rabbit/db generate
      - run: pnpm --filter web build
      - name: install jmeter
        run: |
          curl -sL https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz | tar -xz -C /opt
          echo "/opt/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"
      - name: run stack + jmeter
        run: |
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rabbit_jm
          export REDIS_URL=redis://127.0.0.1:6379
          export NO_ENGINE=0
          # 复用本地栈脚本环境（端口 3101）
          bash -c '
            set -a
            export PORT=3101 WEB_URL=http://localhost:3101
            export REDIS_URL='"$REDIS_URL"' DATABASE_URL='"$DATABASE_URL"'
            export SESSION_SECRET=ci-jm-secret-32chars-ok!!!!!!
            export INTERNAL_TOKEN=ci-internal-token SESSION_COOKIE_SECURE=false
            pnpm --filter @rabbit/db migrate-deploy
            pnpm --filter @rabbit/db seed
            pnpm --filter web start > /tmp/web.log 2>&1 &
            pnpm --filter engine start > /tmp/engine.log 2>&1 &
            pnpm --filter mock start > /tmp/mock.log 2>&1 &
            for i in $(seq 1 90); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3101/api/v1/system/ready || true)
              [ "$code" = "200" ] && break; sleep 1
            done
            [ "$code" = "200" ] || { cat /tmp/web.log; exit 1; }
            bash scripts/run-api-tests.sh http://localhost:3101
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-results
          path: test-results/api/
          retention-days: 30
          if-no-files-found: ignore

  audit:
    name: 依赖审计（high 阻塞）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm audit --prod --audit-level high || echo "audit findings — 收口清单见 rules/git-workflow §5.1"
