name: ci

on:
  # 文档-only 变更（docs/规则/CHANGELOG/原型）不触发全量 CI——纯文档不可能破坏代码，
  # 避免收尾补记证据这类提交浪费 ~7 分钟（2026-09-26 S1 收尾教训）。
  # 代码/配置任何变更仍全量执行；main 保护语义不变。
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "CHANGELOG.md"
      - ".oxfmtignore"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "CHANGELOG.md"
      - ".oxfmtignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN 最小权限（rules/security.md §5.4）：所有 job 只需读仓库内容，显式收紧默认令牌
permissions:
  contents: read

jobs:
  quality:
    name: lint + typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rabbit/db generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: OpenAPI 快照校验（INFRA-001 勘误1：路由↔openapi.json 一致 + api-client 手写路径审计）
        run: node scripts/gen-openapi.mjs --check
      - name: 依赖审计（QA-002：prod 依赖 high+ 阻塞；豁免须登记 docs/security/audit-waivers.md）
        run: pnpm audit --prod --audit-level high

  cli:
    name: go cli (rabbit)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.24"
      # OpenAPI 快照是 apidef 生成输入（gen-cli-services 消费）
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: apidef 契约校验（门禁 4 Go 侧：快照↔paths.go 一致）
        run: node scripts/gen-cli-services.mjs --check
      - name: go test（auth 状态机/分页协议/错误解包）
        working-directory: apps/cli
        run: go test ./...
      - name: 构建 rabbit（linux-amd64 冒烟）
        working-directory: apps/cli
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/RabbitAI-Lab/RabbitCLI-Bootstrap/internal/cli.Version=ci -X github.com/RabbitAI-Lab/RabbitCLI-Bootstrap/internal/cli.Name=rabbit" -o bin/rabbit ./cmd/rabbitcli
      - name: 静态性与契约冒烟（help/schema 输出非空）
        working-directory: apps/cli
        run: ./bin/rabbit --help > /dev/null && ./bin/rabbit schema > /dev/null && file bin/rabbit


  build:
    name: next build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rabbit/db generate
      - run: pnpm --filter web build
      # 不上传 web-build artifact：全仓无 download-artifact 消费方（e2e/api-test 均自建），且
      # upload-artifact v4.6+ 默认过滤点开头目录——apps/web/.next 整树被过滤，artifact 自 v4.6 起一直是空的

  migrate-replay:
    name: 空库全量迁移重放
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rabbit_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rabbit/db generate
      - name: migrate deploy + diff + seed 幂等
        run: |
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rabbit_ci
          pnpm --filter @rabbit/db migrate-deploy
          pnpm --filter @rabbit/db exec prisma migrate diff --from-schema-datamodel prisma/schema.prisma --to-url $DATABASE_URL --exit-code && echo "schema in sync"
          pnpm --filter @rabbit/db seed
          pnpm --filter @rabbit/db seed  # 幂等重跑（rules/database §6.5）
      - name: INFRA-006 RLS 租户隔离验证
        run: |
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rabbit_ci
          node scripts/rls-verify.mjs

  e2e:
    name: Playwright E2E（三类断言）
    runs-on: ubuntu-latest
    needs: build
    # 聚合并发 8 = 2 分片 × 4 workers：单 runner 直上 8 workers 两轮实测过载（4 核 runner
    # 上 UI 响应滞后击穿 10s actionTimeout，flaky 6→8 波动不可稳定）；分片后每 runner 回到
    # 已验证的 4 并发稳定口径，墙钟约减半（12m → ~6m）
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rabbit_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rabbit_e2e
      E2E_REDIS_URL: redis://127.0.0.1:6379
      # e2e mock 由 global-setup 起在 4100+slot（INFRA-005；CI slot0=4100。E2E_MOCK_URL 旧 4000 值已废弃——曾指向 e2e 栈无监听端口）
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rabbit/db generate
      - run: pnpm --filter web build
      - run: pnpm build:plugins
      - run: pnpm exec playwright install --with-deps chromium
      - name: run e2e（含每用例截屏；分片 ${{ matrix.shard }}/2 × 4 workers）
        run: pnpm test:e2e -- --shard=${{ matrix.shard }}/2
      - name: 视觉快照 + GLM-5.3-Flash 还原度比对（配置 GLM_API_KEY 时启用并强制阈值）
        if: env.GLM_API_KEY != '' && matrix.shard == 1
        run: |
          pnpm test:visual
          pnpm visual:diff
      - name: 还原度比对跳过提示（未配置 GLM_API_KEY）
        if: env.GLM_API_KEY == '' && matrix.shard == 1
        run: echo 'GLM_API_KEY 未配置，跳过视觉还原度比对（rules/testing §3.7.2）'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report-shard${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            tests/visual/
          retention-days: 30
          if-no-files-found: ignore

  api-test:
    name: JMeter 接口自动化
    runs-on: ubuntu-latest
    needs: build
    # 2 分片并行（各分片独立栈/独立 DB）：70 计划串行 ~6min → 各分片 ~3min。
    # 禁止同栈共享并发——计划间存在全局单例（license/系统参数/AI 模型默认标记）与共用种子
    # admin@rabbit.test，共享 DB 会互踩（2026-09-29 审计）；分片内仍串行=既有口径不变
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rabbit_jm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20 }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0（v4 已停更，2026-09 弃用告警）
        with: { distribution: temurin, java-version: "17" }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rabbit/db generate
      # S11 SYS-009：web build 静态预渲染阶段 systemParam.findUnique 需 DATABASE_URL
      # （main 上既有缺陷——schema 未变时 generate 不触发；本迭代 oauth 两表触发暴露）
      - run: pnpm --filter web build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rabbit_jm
      - name: build plugin tarballs（S6 PLUG/INTG jmx 上传依赖）
        run: pnpm build:plugins
      - name: cache jmeter（命中免下载——archive.apache.org 限速直连曾达 90s+）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /opt/apache-jmeter-5.6.3
          key: jmeter-5.6.3-ubuntu
      - name: install jmeter（缓存 miss 时 dlcdn CDN 下载 + Apache 官方 SHA512 校验）
        run: |
          set -euo pipefail
          if [ ! -x /opt/apache-jmeter-5.6.3/bin/jmeter ]; then
            curl -sSL --fail -o /tmp/jmeter.tgz https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz \
              || curl -sSL --fail -o /tmp/jmeter.tgz https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
            echo "5978a1a35edb5a7d428e270564ff49d2b1b257a65e17a759d259a9283fc17093e522fe46f474a043864aea6910683486340706d745fcdf3db1505fd71e689083  /tmp/jmeter.tgz" | sha512sum -c -
            tar -xzf /tmp/jmeter.tgz -C /opt
          fi
          echo "/opt/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"
      - name: run stack + jmeter
        run: |
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rabbit_jm
          export REDIS_URL=redis://127.0.0.1:6379
          export NO_ENGINE=0
          # S6：集成凭据加密密钥（jmx 断言值非真实凭据）；Swagger 同步目标为本地 mock → 放开私网出站
          export RABBIT_INTEGRATION_SECRET=ci-jm-integration-secret-32chars!!
          export OUTBOUND_ALLOW_PRIVATE=1
          # 复用本地栈脚本环境：端口随 worktree 槽位（INFRA-005，CI checkout=slot0：web 3200 / mock 4200）
          bash -c '
            set -a
            eval "$(node scripts/rabbit-env.mjs --shell)"
            export PORT=$RABBIT_JM_WEB_PORT WEB_URL=$RABBIT_JM_WEB_URL
            export REDIS_URL='"$REDIS_URL"' DATABASE_URL='"$DATABASE_URL"'
            export SESSION_SECRET=ci-jm-session-secret-32chars-ok!!!!!
            export INTERNAL_TOKEN=ci-internal-token SESSION_COOKIE_SECURE=false
            export RABBIT_INTEGRATION_SECRET='"$RABBIT_INTEGRATION_SECRET"'
            export OUTBOUND_ALLOW_PRIVATE=1
            export RABBIT_USER_LIMIT=1000 # 与 e2e 口径一致：全量套件注册用户数 >30（产品默认 30 不变）
            # S7 AI：mock 供应商(环回 4200+slot)——SSRF 守卫仅豁免环回；种子内置 mock 模型（baseUrl 含 /ai 前缀）
            export AI_ALLOW_PRIVATE_BASEURL=1
            export RABBIT_SEED_AI_MOCK_BASE=http://127.0.0.1:$RABBIT_JM_MOCK_PORT/ai
            pnpm --filter @rabbit/db migrate-deploy
            pnpm --filter @rabbit/db seed
            pnpm --filter web start > /tmp/web.log 2>&1 &
            pnpm --filter engine start > /tmp/engine.log 2>&1 &
            MOCK_PORT=$RABBIT_JM_MOCK_PORT pnpm --filter mock start > /tmp/mock.log 2>&1 &
            for i in $(seq 1 90); do
              code=$(curl -s -o /dev/null -w "%{http_code}" $RABBIT_JM_WEB_URL/api/v1/system/ready || true)
              [ "$code" = "200" ] && break; sleep 1
            done
            [ "$code" = "200" ] || { cat /tmp/web.log; exit 1; }
            bash scripts/run-api-tests.sh $RABBIT_JM_WEB_URL --shard=${{ matrix.shard }}/2
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: jmeter-results-shard${{ matrix.shard }}
          path: |
            test-results/api/
            /tmp/web.log
            /tmp/engine.log
            /tmp/mock.log
          retention-days: 30
          if-no-files-found: ignore

  audit:
    name: 依赖审计（high 阻塞）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high || echo "audit findings — 收口清单见 rules/git-workflow §5.1"
