name: runner-probe

# 一次性探针（UIT-004 收尾·self-hosted 迁移前置）：摸清 xujialiang-docker-arm64 能力面——
# arch/核数/内存/docker services 可行性（e2e/jmeter 依赖 postgres+redis service containers）/
# 工具链残留（node/jmeter/redis）/磁盘。结论回收后本文件可删。
on:
  pull_request:
    paths:
      - ".github/workflows/runner-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: self-hosted 能力探针
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: 机器画像
        run: |
          echo "== arch/kernel =="; uname -a; uname -m
          echo "== cpu/mem =="; nproc; grep MemTotal /proc/meminfo || true
          echo "== disk =="; df -h / /tmp | head -4
          echo "== docker（services 容器可行性）=="
          (docker version --format '{{.Server.Os}}/{{.Server.Arch}} server={{.Server.Version}}' 2>&1 || echo "docker 不可用")
          (docker ps >/dev/null 2>&1 && echo "docker ps OK（service containers 可用）" || echo "docker ps 失败——services 需改本地进程/embedded 方案")
          echo "== 工具链残留 =="
          for c in node pnpm npm java jmeter redis-server psql pg_ctl go; do
            printf '%-14s' "$c"; (command -v $c >/dev/null 2>&1 && $c --version 2>&1 | head -1) || echo "（未安装）"
          done
          echo "== 端口占用（CI 槽位面：3100/3200/4100/4200/6379）=="
          (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ':(3100|3200|4100|4200|6379|5432)' || echo "全部空闲"
          echo "== runner 工作目录 =="; pwd; echo $RUNNER_NAME@$RUNNER_OS/$RUNNER_ARCH
